<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deploy Status</title>
<style>
  :root {
    --bg: #f5f6f8; --surface: #ffffff; --text: #111827; --muted: #5b6472; --line: #dfe3ea;
    --ok: #15803d; --ok-bg: #e7f6ec;
    --fail: #b42318; --fail-bg: #fdecea;
    --run: #8a5a00; --run-bg: #fdf3dc;
    --stop: #4b5563; --stop-bg: #eceff3;
    --focus: #1d4ed8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1116; --surface: #161b22; --text: #e6edf3; --muted: #9aa4b2; --line: #2a313c;
      --ok: #3fb950; --ok-bg: #12301c;
      --fail: #ff6b63; --fail-bg: #3a1716;
      --run: #e3b341; --run-bg: #33270e;
      --stop: #c3cad4; --stop-bg: #252b35;
      --focus: #79b8ff;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1116; --surface: #161b22; --text: #e6edf3; --muted: #9aa4b2; --line: #2a313c;
    --ok: #3fb950; --ok-bg: #12301c;
    --fail: #ff6b63; --fail-bg: #3a1716;
    --run: #e3b341; --run-bg: #33270e;
    --stop: #c3cad4; --stop-bg: #252b35;
    --focus: #79b8ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-variant-numeric: tabular-nums;
  }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  main { max-width: 1120px; margin: 0 auto; padding: 16px 16px 40px; }

  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; margin-bottom: 12px; }
  h1 { font-size: 18px; font-weight: 650; margin: 0; }
  .meta { color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; }
  #sync {
    min-height: 36px; padding: 0 14px; border-radius: 6px; border: 1px solid var(--focus);
    background: var(--focus); color: #fff; font: inherit; font-weight: 600; cursor: pointer;
  }
  #sync:disabled { opacity: .6; cursor: wait; }
  #syncNote { color: var(--muted); font-size: 12px; }
  .bad { color: var(--fail); font-weight: 600; }
  button.repo {
    all: unset; cursor: pointer; font-weight: 600; overflow-wrap: anywhere; border-radius: 4px;
  }
  button.repo:hover { text-decoration: underline; }
  button.repo:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  /* Opens over the list, so a long list never pushes it out of view. */
  #history {
    position: fixed; inset: 0 0 0 auto; margin: 0; height: 100dvh; max-height: 100dvh;
    width: min(440px, 100vw); max-width: 100vw; padding: 0; border: 0; border-left: 1px solid var(--line);
    background: var(--surface); color: var(--text);
  }
  #history::backdrop { background: rgb(0 0 0 / 0.35); }
  #historyHead {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 16px; border-bottom: 1px solid var(--line);
  }
  #historyHead h2 { font-size: 15px; margin: 0; overflow-wrap: anywhere; }
  #historyClose {
    min-width: 40px; min-height: 40px; border: 1px solid var(--line); border-radius: 6px;
    background: transparent; color: inherit; font: inherit; cursor: pointer;
  }
  #historyBody { overflow-y: auto; padding: 8px 16px 24px; }
  #historyBody table { width: 100%; border-collapse: collapse; font-size: 13px; }
  #historyBody th, #historyBody td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  #historyBody th { color: var(--muted); font-weight: 600; }
  #historyBody td:first-child { overflow-wrap: anywhere; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  @media (max-width: 720px) {
    #history { inset: auto 0 0 0; width: 100vw; height: 80dvh; max-height: 80dvh; border: 0; border-top: 1px solid var(--line); border-radius: 12px 12px 0 0; }
  }

  #error {
    display: none; margin-bottom: 12px; padding: 8px 12px; border-radius: 6px;
    background: var(--fail-bg); color: var(--fail); font-weight: 500;
  }

  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
  .stat {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    min-height: 44px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface); color: inherit; font: inherit; text-align: left; cursor: pointer;
  }
  .stat:hover { border-color: var(--muted); }
  .stat .n { font-size: 20px; font-weight: 650; }
  .stat .l { color: var(--muted); font-size: 12px; }
  .stat[aria-pressed="true"] { border-color: var(--focus); box-shadow: inset 0 0 0 1px var(--focus); }
  .stat.FAILED .n { color: var(--fail); }
  .stat.INPROGRESS .n { color: var(--run); }
  .stat.SUCCESSFUL .n { color: var(--ok); }

  .toolbar { margin-bottom: 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
  .toolbar input[type="search"] { flex: 1 1 220px; }
  .toggle { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; cursor: pointer; white-space: nowrap; }
  #scopeCount { white-space: nowrap; font-size: 13px; }
  .toggle input { width: 16px; height: 16px; }
  .toolbar input {
    width: 100%; min-height: 40px; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--surface); color: var(--text); font: inherit;
  }

  .table { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .head, .row {
    display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1.4fr) 112px 120px 96px;
    gap: 12px; align-items: center; padding: 0 12px 0 14px;
  }
  .head {
    min-height: 32px; background: var(--bg); border-bottom: 1px solid var(--line);
    color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
  }
  .row { position: relative; min-height: 48px; padding-top: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--stop); }
  .row.SUCCESSFUL::before { background: var(--ok); }
  .row.FAILED::before { background: var(--fail); }
  .row.FAILED { background: var(--fail-bg); }
  .row.INPROGRESS::before { background: var(--run); }

  .repo { font-weight: 600; overflow-wrap: anywhere; }
  .branch { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; overflow-wrap: anywhere; }
  .commit { color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  .time { color: var(--muted); white-space: nowrap; }
  .muted { color: var(--muted); }

  .badge {
    display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 4px;
    font-size: 12px; font-weight: 650; white-space: nowrap; background: var(--stop-bg); color: var(--stop);
  }
  .badge svg { width: 14px; height: 14px; flex: none; }
  .badge.SUCCESSFUL { background: var(--ok-bg); color: var(--ok); }
  .badge.FAILED { background: var(--fail); color: #fff; }
  .badge.INPROGRESS { background: var(--run-bg); color: var(--run); }
  .badge.NONE { background: transparent; color: var(--muted); border: 1px dashed var(--line); }
  .row.NONE::before { background: var(--line); }

  .empty { padding: 28px 16px; text-align: center; color: var(--muted); }

  @media (max-width: 720px) {
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .head { display: none; }
    .row {
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-areas: "repo badge" "branch branch" "env time";
      row-gap: 4px; padding-top: 10px; padding-bottom: 10px;
    }
    .row .repo { grid-area: repo; }
    .row .badge { grid-area: badge; justify-self: end; }
    .row .branch { grid-area: branch; }
    .row .commit { grid-area: env; }
    .row .time { grid-area: time; justify-self: end; font-size: 12px; }
    .row .commit::before { content: "commit: "; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Deploy Status</h1>
    <div class="meta" aria-live="polite">
      <span id="lastWebhook">Last webhook: …</span>
      <span id="lastSync">Last sync: …</span>
      <span id="rejected" class="bad" hidden></span>
      <span id="updated">Loading…</span>
      <button id="sync" type="button">Sync now</button>
      <span id="syncNote"></span>
    </div>
  </header>
  <div id="error" role="alert"></div>

  <div class="stats" role="group" aria-label="Filter by state">
    <button class="stat" data-filter="ALL" aria-pressed="true"><span class="l">All</span><span class="n" id="c-all">0</span></button>
    <button class="stat FAILED" data-filter="FAILED" aria-pressed="false"><span class="l">Failed</span><span class="n" id="c-FAILED">0</span></button>
    <button class="stat INPROGRESS" data-filter="INPROGRESS" aria-pressed="false"><span class="l">Running</span><span class="n" id="c-INPROGRESS">0</span></button>
    <button class="stat SUCCESSFUL" data-filter="SUCCESSFUL" aria-pressed="false"><span class="l">Passed</span><span class="n" id="c-SUCCESSFUL">0</span></button>
  </div>

  <div class="toolbar">
    <label class="toggle"><input id="showAll" type="checkbox"> Show all repos</label>
    <span id="scopeCount" class="muted"></span>
    <input id="search" type="search" placeholder="Filter by repo, branch, or environment" aria-label="Filter by repo, branch, or environment">
  </div>

  <section class="table" aria-label="Latest pipeline state per repo and branch">
    <div class="head" aria-hidden="true"><div>Repo</div><div>Branch</div><div>State</div><div>Commit</div><div>Updated</div></div>
    <div id="list"></div>
  </section>

  <dialog id="history" aria-labelledby="historyTitle">
    <div id="historyHead">
      <h2 id="historyTitle"></h2>
      <button id="historyClose" type="button" aria-label="Close recent runs">×</button>
    </div>
    <div id="historyBody" aria-live="polite"></div>
  </dialog>
</main>
<script>
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const LABELS = { SUCCESSFUL: 'Passed', FAILED: 'Failed', INPROGRESS: 'Running', STOPPED: 'Stopped', NONE: 'No runs yet' };
  // A repo with no pipeline run has a null state. Treat it as NONE everywhere below.
  const stateOf = (r) => r.state ?? 'NONE';
  // Text plus shape, so state is not carried by color alone.
  const ICONS = {
    SUCCESSFUL: '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M6.2 11.3 2.9 8l1.1-1.1 2.2 2.2 5.8-5.8 1.1 1.1z"/></svg>',
    FAILED: '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M4 2.6 8 6.6l4-4 1.4 1.4-4 4 4 4L12 13.4l-4-4-4 4L2.6 12l4-4-4-4z"/></svg>',
    INPROGRESS: '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="6 3"/></svg>',
    STOPPED: '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="3.5" width="9" height="9" fill="currentColor"/></svg>',
  };
  // Failures first, then running, then stopped and passed. Newest first within a group.
  const RANK = { FAILED: 0, INPROGRESS: 1, STOPPED: 2, SUCCESSFUL: 3, NONE: 4 };

  let rows = [];
  let stateFilter = 'ALL';
  let query = '';
  let showAll = false;

  // By default a repo is shown only if its webhook is installed or it has run a pipeline.
  const isActive = (r) => Boolean(r.has_webhook) || r.state != null;
  const scope = () => (showAll ? rows : rows.filter(isActive));

  function ago(iso) {
    const s = Math.round((Date.now() - new Date(iso).getTime()) / 1000);
    if (Number.isNaN(s)) return '';
    if (s < 60) return 'just now';
    if (s < 3600) return `${Math.floor(s / 60)}m ago`;
    if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
    return `${Math.floor(s / 86400)}d ago`;
  }

  function visible() {
    const q = query.trim().toLowerCase();
    return scope()
      .filter((r) => stateFilter === 'ALL' || stateOf(r) === stateFilter)
      .filter((r) => !q || [r.repo, r.branch, r.environment].some((f) => String(f ?? '').toLowerCase().includes(q)))
      .sort((a, b) => (RANK[stateOf(a)] ?? 9) - (RANK[stateOf(b)] ?? 9) || String(b.updated_at ?? '').localeCompare(String(a.updated_at ?? '')));
  }

  function render() {
    const inScope = scope();
    const counts = { ALL: inScope.length, FAILED: 0, INPROGRESS: 0, SUCCESSFUL: 0 };
    inScope.forEach((r) => { if (stateOf(r) in counts) counts[stateOf(r)]++; });
    const repoCount = new Set(rows.map((r) => r.repo)).size;
    const shownRepos = new Set(inScope.map((r) => r.repo)).size;
    document.getElementById('scopeCount').textContent = showAll
      ? `${repoCount} repos`
      : `${shownRepos} of ${repoCount} repos with a webhook or a run`;
    document.getElementById('c-all').textContent = counts.ALL;
    document.getElementById('c-FAILED').textContent = counts.FAILED;
    document.getElementById('c-INPROGRESS').textContent = counts.INPROGRESS;
    document.getElementById('c-SUCCESSFUL').textContent = counts.SUCCESSFUL;

    const list = visible();
    const el = document.getElementById('list');
    if (list.length === 0) {
      el.innerHTML = `<div class="empty">${rows.length === 0 ? 'No deploys yet. Waiting for the first pipeline event.' : 'Nothing matches this filter.'}</div>`;
      return;
    }
    el.innerHTML = list.map((r) => {
      const state = stateOf(r);
      const hasRun = r.updated_at != null;
      const stamp = hasRun ? new Date(r.updated_at).toLocaleString() : '';
      const when = hasRun
        ? `<time datetime="${esc(r.updated_at)}">${esc(ago(r.updated_at))}</time>`
        : '<span class="muted">—</span>';
      return `<article class="row ${esc(state)}">` +
        `<button class="repo" type="button" data-repo="${esc(r.repo)}" title="Show recent runs">${esc(r.repo)}</button>` +
        `<div class="branch">${esc(r.branch ?? '—')}</div>` +
        `<div><span class="badge ${esc(state)}">${state === 'NONE' ? '' : (ICONS[state] ?? '')}${esc(LABELS[state] ?? state)}</span></div>` +
        `<div class="commit" title="${esc(r.commit_hash ?? '')}">${esc((r.commit_hash ?? '').slice(0, 7) || '—')}</div>` +
        `<div class="time" title="${esc(stamp)}">${when}</div>` +
      `</article>`;
    }).join('');
  }

  // The server returns timestamps as ISO strings, or null when never set.
  function showMeta(meta) {
    const set = (id, label, iso) => {
      document.getElementById(id).textContent = iso ? `${label}: ${ago(iso)}` : `${label}: never`;
    };
    set('lastWebhook', 'Last webhook', meta.last_webhook_at);
    set('lastSync', 'Last sync', meta.last_sync_at);
    const rejected = document.getElementById('rejected');
    if (meta.last_rejected_at) {
      rejected.hidden = false;
      rejected.textContent = `Webhook rejected ${ago(meta.last_rejected_at)}: ${meta.last_rejected_reason ?? 'unknown reason'}`;
    } else {
      rejected.hidden = true;
    }
  }

  // Shows the last 20 state changes for one repo, across its branches.
  async function showHistory(repo) {
    const dialog = document.getElementById('history');
    document.getElementById('historyTitle').textContent = `Recent runs: ${repo}`;
    const body = document.getElementById('historyBody');
    body.textContent = 'Loading…';
    if (!dialog.open) dialog.showModal();
    try {
      const res = await fetch(`/api/history/${encodeURIComponent(repo)}`, { cache: 'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const entries = await res.json();
      if (entries.length === 0) {
        body.textContent = 'No recorded runs yet.';
        return;
      }
      body.innerHTML = '<table><thead><tr><th>Branch</th><th>State</th><th>Environment</th><th>When</th></tr></thead><tbody>' +
        entries.map((e) => `<tr><td>${esc(e.branch)}</td><td>${esc(LABELS[e.state] ?? e.state)}</td>` +
          `<td>${esc(e.environment)}</td><td><time datetime="${esc(e.updated_at)}">${esc(ago(e.updated_at))}</time></td></tr>`).join('') +
        '</tbody></table>';
    } catch (err) {
      body.textContent = `Could not load history (${err.message}).`;
    }
  }

  document.getElementById('list').addEventListener('click', (e) => {
    const repo = e.target.closest('.repo');
    if (repo) showHistory(repo.dataset.repo);
  });
  document.getElementById('historyClose').addEventListener('click', () => document.getElementById('history').close());
  // Clicking the backdrop closes the dialog. Clicks inside it land on its children, so they do not match.
  document.getElementById('history').addEventListener('click', (e) => {
    if (e.target.id === 'history') e.target.close();
  });

  async function loadMeta() {
    try {
      const res = await fetch('/api/meta', { cache: 'no-store' });
      if (res.ok) showMeta(await res.json());
    } catch {
      // The status refresh already reports connection errors.
    }
  }

  async function syncNow() {
    const button = document.getElementById('sync');
    const note = document.getElementById('syncNote');
    button.disabled = true;
    note.textContent = 'Syncing…';
    try {
      const res = await fetch('/api/sync', { method: 'POST', headers: { 'X-Requested-With': 'dashboard' } });
      if (res.status === 401) {
        note.textContent = 'Not signed in. Reload the page and sign in.';
        return;
      }
      if (res.status === 502) {
        note.textContent = 'Sync failed. Bitbucket did not return the repo list. Check the server log.';
        return;
      }
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const { outcome } = await res.json();
      note.textContent = {
        ok: 'Sync finished.',
        partial: 'Synced part of the repos. Click again to continue.',
        busy: 'A sync is already running.',
      }[outcome] ?? 'Sync finished.';
      await Promise.all([load(), loadMeta()]);
    } catch (err) {
      note.textContent = `Sync failed (${err.message}).`;
    } finally {
      button.disabled = false;
    }
  }

  document.getElementById('sync').addEventListener('click', syncNow);

  async function load() {
    const error = document.getElementById('error');
    try {
      const res = await fetch('/api/status', { cache: 'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      rows = await res.json();
      error.style.display = 'none';
      document.getElementById('updated').textContent = `Updated ${new Date().toLocaleTimeString()} · every 15 s`;
      render();
    } catch (err) {
      error.textContent = `Could not refresh (${err.message}). Showing the last data loaded.`;
      error.style.display = 'block';
    }
  }

  document.querySelectorAll('.stat').forEach((btn) => btn.addEventListener('click', () => {
    stateFilter = btn.dataset.filter;
    document.querySelectorAll('.stat').forEach((b) => b.setAttribute('aria-pressed', String(b === btn)));
    render();
  }));
  document.getElementById('search').addEventListener('input', (e) => { query = e.target.value; render(); });
  document.getElementById('showAll').addEventListener('change', (e) => { showAll = e.target.checked; render(); });

  load();
  loadMeta();
  setInterval(load, 15000);
  setInterval(loadMeta, 15000);
  setInterval(render, 30000);
</script>
</body>
</html>
