<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Connection check · Deploy Monitor</title>
<script src="/assets/theme.js"></script>
<link rel="stylesheet" href="/assets/ui.css">
<style>
  .shell { min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; position: relative; }
  .corner { position: absolute; top: 16px; right: 16px; }
  .panel { width: min(100%, 480px); padding: 28px; }
  .panel .brand { margin-bottom: 20px; }
  h1 { font-size: 22px; letter-spacing: -.02em; margin: 0 0 16px; }
  .status { display: flex; gap: 14px; align-items: flex-start; padding: 16px; border-radius: 12px; background: var(--idle-bg); color: var(--idle); }
  .status.ok { background: var(--ok-bg); color: var(--ok); }
  .status.fail { background: var(--fail-bg); color: var(--fail); }
  .status svg.i { width: 22px; height: 22px; margin-top: 1px; }
  #result { margin: 0; font-weight: 700; font-size: 16px; }
  #detail { margin: 4px 0 0; font-size: 14px; overflow-wrap: anywhere; color: var(--text); opacity: .85; }
  .actions { margin-top: 20px; }
  .spinner { margin-top: 3px; }
</style>
</head>
<body>
<div class="shell">
  <button id="theme" class="btn ghost icon corner" type="button"></button>
  <main class="card panel">
    <div class="brand">
      <span class="brand-mark"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg></span>
      Deploy Monitor
    </div>
    <h1>Bitbucket connection</h1>
    <div id="status" class="status" role="status" aria-live="polite">
      <span id="icon"><span class="spinner" aria-hidden="true"></span></span>
      <div>
        <p id="result">Checking…</p>
        <p id="detail"></p>
      </div>
    </div>
    <div class="actions"><button id="recheck" class="btn" type="button">Check again</button></div>
  </main>
</div>
<script>
  const secret = location.pathname.split('/').filter(Boolean).pop();
  const box = document.getElementById('status');
  const icon = document.getElementById('icon');
  const result = document.getElementById('result');
  const detail = document.getElementById('detail');
  const button = document.getElementById('recheck');
  const OK = '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.8 2.8L16.5 9.5"/></svg>';
  const BAD = '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m9 9 6 6M15 9l-6 6"/></svg>';

  function show(kind, title, text) {
    box.className = `status ${kind}`;
    icon.innerHTML = kind === 'ok' ? OK : kind === 'fail' ? BAD : '<span class="spinner" aria-hidden="true"></span>';
    result.textContent = title;
    detail.textContent = text;
  }

  async function check() {
    button.disabled = true;
    show('', 'Checking…', '');
    try {
      const res = await fetch(`/api/check/${encodeURIComponent(secret)}`, { cache: 'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (data.ok) show('ok', 'Connected to Bitbucket', `Workspace "${data.workspace}" is reachable. Repos found: ${data.repos_found}.`);
      else show('fail', 'Not connected', `Workspace "${data.workspace}": ${data.error}`);
    } catch (err) {
      show('fail', 'Check failed', `Could not reach this server (${err.message}).`);
    } finally {
      button.disabled = false;
    }
  }

  button.addEventListener('click', check);
  check();
</script>
</body>
</html>
